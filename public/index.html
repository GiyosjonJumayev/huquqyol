<!doctype html>
<html lang="{{htmlLang}}" data-lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{metaDesc}}">
<title>{{title}}</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/onest/onest-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/spectral/spectral-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{metaDesc}}">
<meta property="og:image" content="/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<div class="sr" aria-live="polite" id="live"></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button" aria-label="{{homeLabel}}">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M12 31 C 16 22, 26 26, 30 13" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="12" cy="31" r="3" fill="var(--accent)"/><circle cx="30" cy="13" r="3.4" fill="var(--stamp)"/></svg>
      HuquqYo‘l
    </button>
    <nav id="stepsNav" aria-label="{{stepsNav}}" hidden><ol class="stepper">
      <li><button type="button" data-go="1" aria-current="step"><span class="n">1</span><span class="lbl">{{step1}}</span></button></li>
      <li><button type="button" data-go="2" disabled><span class="n">2</span><span class="lbl">{{step2}}</span></button></li>
      <li><button type="button" data-go="3" disabled><span class="n">3</span><span class="lbl">{{step3}}</span></button></li>
    </ol></nav>
    <div class="langsw" role="group" aria-label="{{langGroup}}">
      <button type="button" data-lang="uz" aria-pressed="false" lang="uz" title="O‘zbekcha (lotin)">O‘zb</button>
      <button type="button" data-lang="cyr" aria-pressed="false" lang="uz-Cyrl" title="Ўзбекча (кирилл)">Ўзб</button>
      <button type="button" data-lang="ru" aria-pressed="false" lang="ru" title="Русский">Рус</button>
    </div>
  </header>

  <main id="main">
  <div class="resume" id="resume" hidden></div>
  <!-- 1. Vaziyat -->
  <section class="view" id="v1">
    <div class="herobox">
    <svg class="heroroute" viewBox="0 0 240 200" fill="none" aria-hidden="true"><path d="M14 186C70 120 150 170 226 22" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 11"/><circle cx="14" cy="186" r="7" fill="currentColor"/><circle cx="226" cy="22" r="9" stroke="currentColor" stroke-width="3"/></svg>
    <h1 class="hero" tabindex="-1">{{hero}}</h1>
    <p class="lead">{{lead}}</p>
    <div class="ask">
      <label for="problem" class="sr">{{problemLabel}}</label>
      <textarea id="problem" placeholder="{{problemPh}}" maxlength="4000" aria-describedby="askHint askErr"></textarea>
      <div class="askbar">
        <span class="ai"><span class="dot" id="aiDot"></span><span id="aiText">{{aiText}}</span></span>
        <span class="askact">
          <span class="small muted kbd" id="askHint">{{askHint}}</span>
          <button class="btn ghost icon" id="micBtn" type="button" aria-pressed="false" title="{{voice}}" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span class="sr">{{voice}}</span></button>
          <button class="btn primary" id="analyzeBtn" type="button">{{analyze}}</button>
        </span>
      </div>
    </div>
    <p class="error" id="askErr" role="alert" hidden></p>
    <div class="exrow">
      <div class="examples" id="examples" role="group" aria-label="{{examplesLabel}}"><!--EXAMPLES--></div>
      <button class="morex" id="moreEx" type="button">{{moreEx}}</button>
    </div>
    <p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>{{privacy}}</span></p>
    </div>
    <div id="picker">
      <h2 class="sec" id="pickTitle">{{or}}</h2>
      <div class="pickhead" id="pickHead" hidden></div>
      <div class="domains" id="cases"><!--DOMAINS--></div>
    </div>
    <ol class="how" aria-label="{{howLabel}}"><li><span class="hn">1</span>{{how1}}</li><li><span class="hn">2</span>{{how2}}</li><li><span class="hn">3</span>{{how3}}</li></ol>
  </section>

  <!-- 2. Reja -->
  <section class="view" id="v2" hidden></section>

  <!-- 3. Ariza -->
  <section class="view" id="v3" hidden>
    <button class="back" type="button" data-go="2">{{backToPlan}}</button>
    <div class="case-head"><h1 tabindex="-1">{{docReady}}</h1><p>{{docLead}}</p></div>
    <p class="small muted doclang" id="docLang">{{docLangNote}}</p>
    <div class="kicker seglabel" aria-hidden="true">{{toWhom}}</div>
    <div class="seg" role="group" aria-label="{{toWhom}}" id="seg"></div>
    <button class="missing" id="missing" type="button" hidden></button>
    <div class="docgrid">
      <div><p class="small muted formnote">{{formNote}}</p><div id="docForm"></div><button class="btn ghost sm demo" id="demoFill" type="button">✎ {{demoFill}}</button></div>
      <div class="paperwrap">
        <div class="paper" id="paper" aria-label="{{paperLabel}}" lang="{{htmlLang}}"></div>
        <p class="note" id="dlNote" hidden></p>
        <div class="dlrow">
          <button class="btn primary" id="dlDocx" type="button">Word (DOCX)</button>
          <button class="btn ghost" id="dlPdf" type="button">PDF</button>
          <button class="btn ghost" id="printBtn" type="button">{{print}}</button>
          <button class="btn ghost" id="copyTxt" type="button">{{copy}}</button>
        </div>
        <section class="card howto" id="howto" aria-labelledby="howtoH"><h2 id="howtoH">{{howto}}</h2><ol id="howtoSteps"></ol><div class="howlinks" id="howtoLinks"></div></section>
      </div>
    </div>
  </section>

</main>
  <footer>
    <div><b>{{disclaimerB}}</b> {{disclaimer}}</div>
    <div>{{sources}} <a href="https://lex.uz" target="_blank" rel="noopener noreferrer">lex.uz</a>. {{checked}}</div>
    <div>{{local}} <button class="linkbtn" id="wipe" type="button">{{wipe}}</button></div>
  </footer>
</div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgT" aria-describedby="dlgP">
  <h2 id="dlgT"></h2>
  <p id="dlgP"></p>
  <div class="dlgact"><button class="btn ghost" id="dlgNo" type="button" autofocus>{{cancel}}</button><button class="btn danger" id="dlgOk" type="button"></button></div>
</dialog>
<!--META-->
</body>
</html>
