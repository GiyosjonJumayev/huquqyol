name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]          # hostinglarda uchraydigan versiyalar
    services:
      postgres:                     # hisoblar, obunalar va kelishuvlar testlari (test/db.test.js)
        image: postgres:16
        env:
          POSTGRES_USER: huquqyol
          POSTGRES_PASSWORD: huquqyol
          POSTGRES_DB: huquqyol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huquqyol" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://huquqyol:huquqyol@127.0.0.1:5432/huquqyol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: huquqyol-hosting
          path: dist/huquqyol-hosting.zip
  docker:
    runs-on: ubuntu-latest
    env:
      DC: docker compose -f deploy/compose.yml --env-file .env
    steps:
      - uses: actions/checkout@v4
      - name: Sozlama
        run: |
          {
            echo NODE_ENV=production
            echo PUBLIC_HOST=ci.example.uz
            echo POSTGRES_PASSWORD=ci0123456789abcdef
            echo APP_SECRET=0123456789abcdef0123456789abcdef
          } > .env
          $DC config -q
      - name: Stack ishga tushadi
        run: $DC up -d --build db app backup
      - name: Baza bilan tayyor
        run: |
          for i in $(seq 1 40); do $DC exec -T app wget -qO- http://127.0.0.1:3000/api/ready && break; sleep 2; done
          $DC exec -T app wget -qO- http://127.0.0.1:3000/api/ready | grep '"db":true'
      - name: Ishga tushirishdan oldingi tekshiruv
        run: $DC exec -T app node scripts/check-prod.mjs
      - name: Zaxira olinadi va undan tiklanadi
        run: |
          exec > >(tee step.txt) 2>&1
          set -x
          $DC exec -T backup sh /backup.sh once | grep zaxira
          sudo chmod -R a+rX backups
          echo HA | sh deploy/restore.sh "$(ls -t backups/*.dump | head -1)"
          for i in $(seq 1 20); do $DC exec -T app wget -qO- http://127.0.0.1:3000/api/ready && break; sleep 2; done
          $DC exec -T app wget -qO- http://127.0.0.1:3000/api/ready | grep '"db":true'
      - name: Caddy sozlamasi
        run: docker run --rm -e PUBLIC_HOST=ci.example.uz -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - if: failure()
        run: |
          $DC logs --no-color --tail 25 app db backup > log.txt 2>&1 || true
          echo "::error::$(tail -c 2500 log.txt | tr '\n' '|')"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
