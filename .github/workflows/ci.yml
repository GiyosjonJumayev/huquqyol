name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]          # hostinglarda uchraydigan versiyalar
    services:
      postgres:                     # hisoblar, obunalar va kelishuvlar testlari (test/db.test.js)
        image: postgres:16
        env:
          POSTGRES_USER: huquqyol
          POSTGRES_PASSWORD: huquqyol
          POSTGRES_DB: huquqyol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huquqyol" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://huquqyol:huquqyol@127.0.0.1:5432/huquqyol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: huquqyol-hosting
          path: dist/huquqyol-hosting.zip
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
