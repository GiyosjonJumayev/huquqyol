name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]          # hostinglarda uchraydigan versiyalar
    services:
      postgres:                     # hisoblar, obunalar va kelishuvlar testlari (test/db.test.js)
        image: postgres:16
        env:
          POSTGRES_USER: huquqyol
          POSTGRES_PASSWORD: huquqyol
          POSTGRES_DB: huquqyol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U huquqyol" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://huquqyol:huquqyol@127.0.0.1:5432/huquqyol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: huquqyol-hosting
          path: dist/huquqyol-hosting.zip
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack starts, becomes ready, backs up
        run: |
          printf 'NODE_ENV=production\nPUBLIC_HOST=localhost\nPOSTGRES_PASSWORD=ci0123456789abcdef\nAPP_SECRET=0123456789abcdef0123456789abcdef\n' > .env
          docker compose -f deploy/compose.yml --env-file .env config -q
          docker compose -f deploy/compose.yml --env-file .env up -d --build db app backup
          for i in $(seq 1 40); do docker compose -f deploy/compose.yml --env-file .env exec -T app wget -qO- http://127.0.0.1:3000/api/ready && break; sleep 2; done
          docker compose -f deploy/compose.yml --env-file .env exec -T app wget -qO- http://127.0.0.1:3000/api/ready | grep '"db":true'
          docker compose -f deploy/compose.yml --env-file .env exec -T app node scripts/check-prod.mjs
          docker compose -f deploy/compose.yml --env-file .env exec -T backup sh /backup.sh once | grep zaxira
          docker run --rm -e PUBLIC_HOST=localhost -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - if: failure()
        run: docker compose -f deploy/compose.yml --env-file .env logs --no-color | tail -80
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
