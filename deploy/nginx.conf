# /etc/nginx/sites-available/huquqyol  (VPS: Ubuntu/Debian)
# huquqyol.uz ni o‘z domeningizga almashtiring. HTTPS sertifikatini certbot qo‘shadi:
#   sudo certbot --nginx -d huquqyol.uz -d www.huquqyol.uz
server {
    listen 80;
    listen [::]:80;
    server_name huquqyol.uz www.huquqyol.uz;

    client_max_body_size 64k;          # ilova 32 KB dan katta so‘rovni o‘zi ham rad etadi
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 35s;            # AI tahlili 20 soniyagacha davom etishi mumkin
    }
}
